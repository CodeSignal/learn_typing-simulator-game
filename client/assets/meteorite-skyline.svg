<svg class="meteorite-skyline" xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 260" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="sg-far-building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#203255"/>
      <stop offset="100%" stop-color="#111c34"/>
    </linearGradient>
    <linearGradient id="sg-mid-building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243756"/>
      <stop offset="100%" stop-color="#13213a"/>
    </linearGradient>
    <linearGradient id="sg-foreground-building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d273b"/>
      <stop offset="62%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="sg-glass-building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f4468"/>
      <stop offset="45%" stop-color="#18253d"/>
      <stop offset="100%" stop-color="#0c1422"/>
    </linearGradient>
    <linearGradient id="sg-atmosphere" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081126" stop-opacity="0"/>
      <stop offset="48%" stop-color="#0d1c3d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#02050d" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="sg-depth-haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8cb1ff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#8cb1ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffd29a" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="sg-horizon-amber" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ffb46a" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ff9f52" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff9f52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg-horizon-blue" cx="50%" cy="90%" r="70%">
      <stop offset="0%" stop-color="#74a3ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#74a3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg-front-highlight" cx="50%" cy="0%" r="110%">
      <stop offset="0%" stop-color="#4f6a98" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#253756" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#253756" stop-opacity="0"/>
    </radialGradient>

    <pattern id="sg-far-windows" patternUnits="userSpaceOnUse" width="20" height="18">
      <rect x="3" y="4" width="3" height="2" fill="#ffdca8" opacity="0.34"/>
      <rect x="11" y="4" width="2" height="2" fill="#8dc9ff" opacity="0.24"/>
      <rect x="3" y="11" width="3" height="2" fill="#ffdca8" opacity="0.24"/>
      <rect x="11" y="11" width="2" height="2" fill="#ffdca8" opacity="0.18"/>
    </pattern>
    <pattern id="sg-mid-windows" patternUnits="userSpaceOnUse" width="24" height="20">
      <rect x="4" y="4" width="5" height="3" fill="#ffd596" opacity="0.76"/>
      <rect x="14" y="4" width="4" height="3" fill="#8fd4ff" opacity="0.56"/>
      <rect x="4" y="12" width="5" height="3" fill="#ffd596" opacity="0.62"/>
      <rect x="14" y="12" width="4" height="3" fill="#ffd596" opacity="0.42"/>
    </pattern>
    <pattern id="sg-front-windows" patternUnits="userSpaceOnUse" width="26" height="22">
      <rect x="4" y="4" width="6" height="4" fill="#ffd189" opacity="0.9"/>
      <rect x="15" y="4" width="5" height="4" fill="#8fd4ff" opacity="0.72"/>
      <rect x="4" y="13" width="6" height="4" fill="#ffd189" opacity="0.72"/>
      <rect x="15" y="13" width="5" height="4" fill="#ffd189" opacity="0.54"/>
    </pattern>
    <pattern id="sg-glass-windows" patternUnits="userSpaceOnUse" width="22" height="18">
      <rect x="4" y="3" width="4" height="12" fill="#7fd3ff" opacity="0.55"/>
      <rect x="11" y="3" width="3" height="12" fill="#c8f0ff" opacity="0.42"/>
    </pattern>

    <filter id="sg-blur-far" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="sg-blur-mid" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="sg-window-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.75" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sg-beacon-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

